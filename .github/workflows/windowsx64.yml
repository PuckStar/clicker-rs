name: Windows Release

on:
  push:
    tags: ['v*']
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
   
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Show repo tree (PowerShell)
        shell: pwsh
        run: Get-ChildItem -Path . -Recurse -Force

      - name: Install Rust (MSVC toolchain)
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable-x86_64-pc-windows-msvc
          default: true

      - name: Build (release)
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: clicker-windows-x64
          path: target\\x86_64-pc-windows-msvc\\release\\clicker.exe

      - name: Publish to GitHub Release (attach exe)
        if: startsWith(github.ref, 'refs/tags/')
        uses: svenstaro/upload-release-action@v2
        with:
          file: target/x86_64-pc-windows-msvc/release/clicker.exe
          asset_name: clicker-windows-x64.exe
          tag: ${{ github.ref }}
          overwrite: true
